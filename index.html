<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" id="theme-color" content="#f5f5f5" />
    <meta
      name="description"
      content="Explore specific Vietnamese topics from public discussions and labelled news. See supporting sources and transparent evidence-based trend scores."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Trendifest — social trend graph</title>
    <script>
      // Resolve the workspace preference before paint to avoid a theme flash.
      (() => {
        let dark = false;
        try {
          const stored = localStorage.getItem("trendifest-theme");
          if (stored === "dark" || stored === "light") dark = stored === "dark";
        } catch {
          // Storage can be unavailable; keep the default light appearance.
        }
        document.documentElement.classList.toggle("dark", dark);
        document
          .getElementById("theme-color")
          .setAttribute("content", dark ? "#141416" : "#f5f5f5");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
