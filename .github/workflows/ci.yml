name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: trendifest
          POSTGRES_PASSWORD: trendifest
          POSTGRES_DB: trendifest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trendifest -d trendifest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRENDIFEST_TEST_DATABASE_URL: postgres://trendifest:trendifest@127.0.0.1:5432/trendifest_test
      TRENDIFEST_SOCIAL: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: .cache/transformers
          key: models-${{ runner.os }}-${{ hashFiles('server/db.ts', 'server/social/embed.ts', 'bun.lock') }}

      - name: Install dependencies and build graph library
        run: bun install --frozen-lockfile

      - name: Run all CI checks
        run: bun run ci
